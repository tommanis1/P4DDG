<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playground</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
        }
        .left-panel {
            width: 50%;
            padding: 20px;
            background: #f5f5f5;
        }
        .right-panel {
            width: 50%;
            padding: 20px;
            background: #ffffff;
        }
        #code-input {
            width: 100%;
            height: calc(100vh - 100px);
            margin-bottom: 10px;
            font-family: monospace;
            padding: 10px;
            box-sizing: border-box;
        }
        #compile-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 4px;
        }
        #compile-btn:hover {
            background: #45a049;
        }
        #output {
            width: 100%;
            height: calc(100vh - 40px);
            font-family: monospace;
            padding: 10px;
            box-sizing: border-box;
            background: #f8f8f8;
            border: 1px solid #ddd;
            resize: none;
        }
    </style>
</head>
<body>
    <div class="left-panel">
        <button id="compile-btn" onClick="document.getElementById('output').value = globalCompile(document.getElementById('code-input').value)">Compile</button>
        <textarea id="code-input" placeholder="Enter your code here..."></textarea>
    </div>
    <div class="right-panel">
        <textarea id="output" readonly placeholder="Output will appear here..."></textarea>
    </div>
</body>
<script language="javascript" src="gen/all.js" defer></script>
</html>
