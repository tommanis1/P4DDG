<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playground</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        .split-container {
            display: flex;
            height: 85vh;
        }
        .left-panel {
            width: 50%;
            padding: 20px;
            background: #f5f5f5;
        }
        .right-panel {
            width: 50%;
            padding: 20px;
            background: #ffffff;
        }
        #code-input {
            width: 100%;
            height: calc(85vh - 100px);
            margin-bottom: 10px;
            font-family: monospace;
            padding: 10px;
            box-sizing: border-box;
        }
        #compile-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 4px;
        }
        #compile-btn:hover {
            background: #45a049;
        }
        #output {
            width: 100%;
            height: calc(85vh - 40px);
            font-family: monospace;
            padding: 10px;
            box-sizing: border-box;
            background: #f8f8f8;
            border: 1px solid #ddd;
            resize: none;
        }
        .visualization-container {
            padding: 20px;
            background: #ffffff;
            border-top: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="split-container">
        <div class="left-panel">
            <button id="compile-btn" onClick="handleCompile()">Compile</button>
            <textarea id="code-input" placeholder="Enter your code here..."></textarea>
        </div>
        <div class="right-panel">
            <textarea id="output" readonly placeholder="P4 code will appear here..."></textarea>
        </div>
    </div>

    <div class="visualization-container">
        <h2>Transducer Visualization</h2>
        <div id="graph"></div>
    </div>
</body>
<script language="javascript" src="gen/all.js" defer></script>
<script src="main.js"></script>
<script src="viz-standalone.js"></script>
<script>
    Viz.instance().then(function(viz) {
        var svg = viz.renderSVGElement("digraph { a -> b }");
        document.getElementById("graph").appendChild(svg);
    });
</script>
</html>
